<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add/Edit Experience</title>

<!-- Bootstrap 5.3.3 -->
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  rel="stylesheet"
/>
<link rel="stylesheet" href="../../assets/css/main.css" />

<style>
        .stepper-new {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2rem;
        padding: 1rem 0;
        position: relative;
      }
      .stepper-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 0 0 auto;
        z-index: 2;
      }
      .stepper-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #e9ecef; /* Incomplete */
        color: #6c757d;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        border: 2px solid #e9ecef;
        transition: all 0.3s;
      }
      .stepper-step.active .stepper-circle {
        background-color: #dc3545; /* Active (Red) */
        color: white;
        border-color: #dc3545;
      }
      .stepper-step.completed .stepper-circle {
        background-color: #28a745; /* Completed (Green) */
        color: white;
        border-color: #28a745;
      }
      .stepper-label {
        margin-top: 0.5rem;
        font-size: 0.75rem; /* Small font size for labels */
        color: #6c757d;
        font-weight: 500;
        transition: color 0.3s;
      }
      .stepper-step.active .stepper-label {
        color: #343a40;
        font-weight: 700;
      }
      .stepper-line {
        position: absolute;
        height: 2px;
        background-color: #e9ecef; /* Incomplete Line */
        top: 25px; /* Aligns with the middle of the circle */
        left: 20px;
        right: 20px;
        margin-left: 1rem;
        margin-right: 1rem;
        width: calc(100% - 40px);
        z-index: 1;
        display: flex;
        justify-content: space-between;
      }
      .stepper-line-segment {
          height: 2px;
          background-color: #e9ecef;
          flex: 1;
      }
      .stepper-segment-active {
          background-color: #28a745; /* Green for completed segments */
      }
        .form-control.is-valid,
        .form-select.is-valid,
        .form-control.is-invalid,
        .form-select.is-invalid {
            background-image: none !important; 
            padding-right: 0.75rem !important; 
        }
    </style>
</head>


<body class="bg-light py-5">
  <div class="container" style="max-width: 740px;">
    <div class="bg-white p-4 rounded-4 shadow-lg"
          style="width: 100%; max-width: 672px;"
  >
    
    <!-- Header: Back Button and Close Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">
          
          <!-- LEFT: Back Button (NOW ACTIVE) -->
          <a href="skill.html" class="text-secondary fw-bold text-decoration-none p-2 me-auto">
              ← Back 
          </a>
          
          <!-- CENTER: Empty to ensure spacing -->
          <span class="mx-auto"></span> 
          
          <!-- RIGHT: Close Button -->
      <a href="../../index.html" class="text-secondary fw-bold text-decoration-none p-2 ms-auto">Close</a>
    </div>

      <!-- STEPPER COMPONENT (Step 6 Active) -->
      <div class="stepper-new">
        <!-- Connecting Line Segments -->
        <div class="stepper-line">
            <!-- Segment 1: Completed (from Profile to Education)  -->
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <!-- Remaining 4 Segments: Incomplete -->
            <div class="stepper-line-segment"></div>
            <div class="stepper-line-segment"></div>
        </div>

        <!-- Step 1: Profile (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">1</div>
          <div class="stepper-label">Profile</div>
        </div>

        <!-- Step 2: Contact (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">2</div>
          <div class="stepper-label">Contact</div>
        </div>

        <!-- Step 3: Education (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">3</div>
          <div class="stepper-label">Education</div>
        </div>
        
        <!-- Step 4: Experience (Active) -->
        <div class="stepper-step active">
          <div class="stepper-circle">4</div>
          <div class="stepper-label">Experience</div>
        </div>

        <!-- Step 5: Skill (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">5</div>
          <div class="stepper-label">Skill</div>
        </div>

        <!-- Step 6: Availability (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">6</div>
          <div class="stepper-label">Availability</div>
        </div>
      </div>
      <!-- END STEPPER COMPONENT -->
    
    <!-- Page Title -->
    <h1 class="h4 fw-bold text-dark mb-4 text-center">Experience</h1>

    <!-- Form -->
    <form id="experienceForm" action="skill.html" method="GET" novalidate>
      <!-- Title -->
      <div class="mb-3">
        <label for="title" class="form-label">Title*</label>
        <input
          id="title"
          name="title"
          type="text"
          class="form-control"
          placeholder="Ex: Assistant Store Manager"
          required
        />
      </div>

      <!-- Employment Type -->
      <div class="mb-3">
        <label for="employmentType" class="form-label">Employment Type*</label>
        <select id="employmentType" name="employmentType" class="form-select" required>
          <option value="">Please Select</option>
          <option>Full-time</option>
          <option>Part-time</option>
          <option>Self-employed</option>
          <option>Freelance</option>
          <option>Contract</option>
          <option>Internship</option>
          <option>Apprenticeship</option>
        </select>
        <div id="employmentTypeFeedback" class="invalid-feedback d-block mt-1" style="display:none;"></div>
      </div>

      <!-- Company -->
      <div class="mb-3">
        <label for="company" class="form-label">Company*</label>
        <input
          id="company"
          name="company"
          type="text"
          class="form-control"
          placeholder="Ex: Sukiya"
          required
        />
      </div>

      <!-- Start Date -->
      <div class="mb-4">
        <label for="startMonth" class="form-label">Start Date*</label>
        <div class="row g-2">
          <div class="col">
            <select id="startMonth" name="startMonth" class="form-select" required>
              <option value="">Month</option>
            </select>
          </div>
          <div class="col">
            <select id="startYear" name="startYear" class="form-select" required>
              <option value="">Year</option>
            </select>
          </div>
        </div>
        <div id="startMonthFeedback" class="invalid-feedback d-block mt-1" style="display:none;"></div>
      </div>

      <!-- End Date -->
      <div class="mb-4" id="endDateWrapper">
        <label for="endMonth" class="form-label">End Date*</label>
        <div class="row g-2" id="endDateSelects">
          <div class="col">
            <select id="endMonth" name="endMonth" class="form-select">
              <option value="">Month</option>
            </select>
          </div>
          <div class="col">
            <select id="endYear" name="endYear" class="form-select">
              <option value="">Year</option>
            </select>
          </div>
        </div>
        <input
          id="currentDateField"
          type="text"
          value="Current"
          disabled
          class="form-control bg-light text-secondary mt-2"
          style="display:none;"
        />
      </div>

      <!-- Checkbox -->
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="currentlyWorking" name="currentlyWorking">
        <label class="form-check-label" for="currentlyWorking">
          I currently work here
        </label>
      </div>

      <!-- Location -->
      <div class="mb-3">
        <label for="location" class="form-label">Location</label>
        <input
          id="location"
          name="location"
          type="text"
          class="form-control"
          placeholder="Ex: Shinagawa, Tokyo"
        />
      </div>

      <!-- Description -->
      <div class="mb-4">
        <label for="description" class="form-label">Description</label>
        <textarea
          id="description"
          name="description"
          rows="4"
          class="form-control"
          placeholder="List your duties and responsibilities"
        ></textarea>
      </div>

      <!-- Buttons -->
      <div class="text-center">
        <a href="skill.html" class="text-secondary text-decoration-underline d-block mb-3">Skip</a>
        <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">Save</button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Validation -->
<script type="module">
import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js';
import { initializeExperienceValidation } from '../../assets/js/modules/validation.js';

window.addEventListener('DOMContentLoaded', () => {
  checkAuthAndRedirect();
  initializeExperienceValidation();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add/Edit Skill</title>

  <!-- Bootstrap 5.3.3 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container" style="max-width: 740px;">
    <div class="bg-white p-4 rounded-4 shadow-lg"
          style="width: 100%; max-width: 672px;">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 fw-bold text-dark mb-0">Add Skill</h1>
        <a href="../../index.html" class="text-secondary fw-semibold text-decoration-none">Close</a>
      </div>

      <!-- Form -->
      <form id="skillForm" action="/pages/addEdit/availability.html" method="GET" novalidate>

        <!-- Skill -->
        <div class="mb-3">
          <label for="skill" class="form-label">Skill*</label>
          <input
            id="skill"
            name="skill"
            type="text"
            placeholder="Ex: Adobe"
            required
            class="form-control"
          />
        </div>

        <!-- Certification -->
        <div class="mb-4">
          <label for="certification" class="form-label">Certification*</label>
          <input
            id="certification"
            name="certification"
            type="text"
            placeholder="Ex: Adobe Certified Professional"
            required
            class="form-control"
          />
        </div>

        <!-- Buttons -->
        <div class="text-center">
          <a href="availability.html" class="text-secondary text-decoration-underline d-block mb-3">Skip</a>
          <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">Save</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validation -->
  <script type="module">
    import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js'; 
    import { initializeSkillValidation } from '../../assets/js/modules/validation.js'; 
        
    window.addEventListener('DOMContentLoaded', () => {
      checkAuthAndRedirect();
      initializeSkillValidation(); 
    });
  </script>
</body>
</html>

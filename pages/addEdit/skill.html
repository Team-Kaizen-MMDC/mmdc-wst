<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Skill</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">

    <!--  Stepper Styles -->
  <style>
    .stepper-new {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
      padding: 1rem 0;
      position: relative;
    }
    .stepper-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 0 0 auto;
      z-index: 2;
    }
    .stepper-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #e9ecef; /* Incomplete */
      color: #6c757d;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      border: 2px solid #e9ecef;
      transition: all 0.3s;
    }
    .stepper-step.active .stepper-circle {
      background-color: #dc3545; /* Active (Red) */
      color: white;
      border-color: #dc3545;
    }
    .stepper-step.completed .stepper-circle {
      background-color: #28a745; /* Completed (Green) */
      color: white;
      border-color: #28a745;
    }
    .stepper-label {
      margin-top: 0.5rem;
      font-size: 0.75rem; /* Small font size for labels */
      color: #6c757d;
      font-weight: 500;
      transition: color 0.3s;
    }
    .stepper-step.active .stepper-label {
      color: #343a40;
      font-weight: 700;
    }
    .stepper-line {
      position: absolute;
      height: 2px;
      background-color: #e9ecef; /* Incomplete Line */
      top: 25px; /* Aligns with the middle of the circle */
      left: 20px;
      right: 20px;
      margin-left: 1rem;
      margin-right: 1rem;
      width: calc(100% - 40px);
      z-index: 1;
      display: flex;
      justify-content: space-between;
    }
    .stepper-line-segment {
        height: 2px;
        background-color: #e9ecef;
        flex: 1;
    }
    .stepper-segment-active {
        background-color: #28a745; /* Green for completed segments */
    }
  </style>
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <main id="main-content" class="container" style="max-width: 740px;" role="main">
    <div class="bg-white p-4 rounded-4 shadow-lg" style="width: 100%; max-width: 672px;">

      <!-- Header : Back Button and Close Button-->
      <div class="d-flex justify-content-between align-items-center mb-4">

          <!-- LEFT: Back Button -->
          <a href="experience.html" class="text-secondary fw-bold text-decoration-none p-2 me-auto">
              ← Back 
          </a>
          
          <!-- CENTER -->
          <span class="mx-auto"></span> 

          <!-- RIGHT: Close Button -->
        <a href="../../index.html" class="text-secondary fw-bold text-decoration-none p-2 ms-auto">Close</a>
      </div>

      <!-- STEPPER COMPONENT (Step 5 Active) -->
      <div class="stepper-new">
        <!-- Connecting Line Segments -->
        <div class="stepper-line">
            <!-- Segment 1, 2, 3, 4: Completed -->
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <!-- Remaining 1 Segment: Incomplete -->
            <div class="stepper-line-segment"></div>
        </div>

        <!-- Step 1: Profile (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">1</div>
          <div class="stepper-label">Profile</div>
        </div>

        <!-- Step 2: Contact (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">2</div>
          <div class="stepper-label">Contact</div>
        </div>

        <!-- Step 3: Education (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">3</div>
          <div class="stepper-label">Education</div>
        </div>
        
        <!-- Step 4: Experience (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">4</div>
          <div class="stepper-label">Experience</div>
        </div>

        <!-- Step 5: Skill (Active) -->
        <div class="stepper-step active">
          <div class="stepper-circle">5</div>
          <div class="stepper-label">Skill</div>
        </div>

        <!-- Step 6: Availability (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">6</div>
          <div class="stepper-label">Availability</div>
        </div>
        </main>
      <!-- END STEPPER COMPONENT -->

        <h1 class="h4 fw-bold text-dark mb-4 text-center">Add Skill</h1>

      <!-- Form -->
      <form id="skillForm" action="/pages/addEdit/availability.html" method="GET" novalidate="">

        <!-- Skill -->
        <div class="mb-3">
          <label for="skill" class="form-label">Skill*</label>
          <input id="skill" name="skill" type="text" placeholder="Ex: Adobe" required="" class="form-control">
        </div>

        <!-- Certification -->
        <div class="mb-4">
          <label for="certification" class="form-label">Certification*</label>
          <input id="certification" name="certification" type="text" placeholder="Ex: Adobe Certified Professional" required="" class="form-control">
        </div>

        <!-- Buttons -->
        <div class="text-center">
          <a href="availability.html" class="text-secondary text-decoration-underline d-block mb-3">Skip</a>
          <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">Save</button>
        </div>

      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validation -->
  <script type="module">
    import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js'; 
    import { initializeSkillValidation } from '../../assets/js/modules/validation.js'; 
        
    window.addEventListener('DOMContentLoaded', () => {
      checkAuthAndRedirect();
      initializeSkillValidation(); 
    });
  </script>


</body></html>

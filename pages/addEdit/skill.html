<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add/Edit Skill</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../../assets/css/main.css" />
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-lg">
      <!-- Header -->
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">Add Skill</h1>
        <a
          href="../../index.html"
          class="text-gray-500 hover:text-gray-700 font-bold"
        >
          close
        </a>
      </div>

      <!-- Form -->
      <form class="space-y-6" action="../signin.html" method="GET">
        <!-- Skill -->
        <div>
          <label for="skill" class="block text-sm font-medium text-gray-700"
            >Skill*</label
          >
          <input
            id="skill"
            name="skill"
            type="text"
            placeholder="Ex: Adobe"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
          />
        </div>

        <!-- Certification -->
        <div>
          <label
            for="certification"
            class="block text-sm font-medium text-gray-700"
            >Certification*</label
          >
          <input
            id="certification"
            name="certification"
            type="text"
            placeholder="Ex: Adobe Certified Professional"
            required
            class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500"
          />
        </div>

        <!-- Buttons Section -->
        <div class="flex flex-col items-center space-y-4 pt-4">
          <!-- Skip Button (Above Save Button) -->
          <a
            href="../profileDashboard.html"
            class="text-sm font-medium text-gray-500 underline hover:text-red-600 focus:outline-none"
          >
            Skip
          </a>

          <!-- Save Button -->
          <button
            type="submit"
            class="w-40 flex justify-center py-2 px-4 border border-transparent rounded-3xl shadow-sm text-sm font-medium text-white bg-red-500 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition duration-150 ease-in-out"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  </body>
</html>

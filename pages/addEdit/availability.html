<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Availability</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />

  </head>

  <body class="d-flex align-items-center justify-content-center min-vh-100">
    <div
      class="form-container bg-white p-4 p-md-5 rounded-3 shadow-lg my-4 mx-3 "
      aria-label="Availability and Preferences Form"
    >
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold text-dark">Availability / Preferences</h1>
        <a
          href="../../index.html"
          class="text-secondary fw-bold text-decoration-none"
          aria-label="Close"
        >
          close
        </a>
      </div>

      <!-- Form -->
      <form class="g-3" action="../signin.html" method="GET">
        <!-- Status -->
        <div class="mb-3">
          <label for="status" class="form-label">Status</label>
          <input
            id="status"
            name="status"
            type="text"
            placeholder="Ex: Assistant Store Manager"
            required
            class="form-control"
          />
        </div>

        <!-- Location -->
        <div class="mb-3">
          <label for="location" class="form-label">Location</label>
          <input
            id="location"
            name="location"
            type="text"
            placeholder="Ex: Shinigawa, Tokyo"
            required
            class="form-control"
          />
        </div>

        <!-- Work Preferences -->
        <div class="mb-4">
          <label for="workPreferences" class="form-label">Work Preferences</label>
          <input
            id="workPreferences"
            name="workPreferences"
            type="text"
            placeholder="Ex: full-time / shift-based / overtime OK"
            required
            class="form-control"
          />
        </div>

        <!-- Buttons Section -->
        <div
          class="d-flex flex-column align-items-center pt-3"
          role="group"
          aria-label="Form actions"
        >
          <!-- Skip Button (Above Save Button) -->
          <a
            href="../profileDashboard.html"
            class="btn btn-link text-secondary text-decoration-underline"
            aria-label="Skip to Profile Dashboard"
          >
            Skip
          </a>

          <!-- Save Button -->
          <button
            type="submit"
            class="btn btn-custom-red rounded-pill shadow-sm mt-3 w-50"
          >
            Save
          </button>
        </div>
      </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    
<script type="module">
    import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js'; 
    import { initializeAvailabilityValidation } from '../../assets/js/modules/validation.js'; 

    window.addEventListener('DOMContentLoaded', () => {
        checkAuthAndRedirect();
        initializeAvailabilityValidation(); 
    });
</script>

  </body>
</html>

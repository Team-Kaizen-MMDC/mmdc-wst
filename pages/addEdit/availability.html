<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Availability</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />

    <!-- Stepper Styles -->
    <style>
      .stepper-new {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2rem;
        padding: 1rem 0;
        position: relative;
      }
      .stepper-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 0 0 auto;
        z-index: 2;
      }
      .stepper-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #e9ecef; /* Incomplete */
        color: #6c757d;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        border: 2px solid #e9ecef;
        transition: all 0.3s;
      }
      .stepper-step.active .stepper-circle {
        background-color: #dc3545; /* Active (Red) */
        color: white;
        border-color: #dc3545;
      }
      .stepper-step.completed .stepper-circle {
        background-color: #28a745; /* Completed (Green) */
        color: white;
        border-color: #28a745;
      }
      .stepper-label {
        margin-top: 0.5rem;
        font-size: 0.75rem; /* Small font size for labels */
        color: #6c757d;
        font-weight: 500;
        transition: color 0.3s;
      }
      .stepper-step.active .stepper-label {
        color: #343a40;
        font-weight: 700;
      }
      .stepper-line {
        position: absolute;
        height: 2px;
        background-color: #e9ecef; /* Incomplete Line */
        top: 25px; /* Aligns with the middle of the circle */
        left: 20px;
        right: 20px;
        margin-left: 1rem;
        margin-right: 1rem;
        width: calc(100% - 40px);
        z-index: 1;
        display: flex;
        justify-content: space-between;
      }
      .stepper-line-segment {
        height: 2px;
        background-color: #e9ecef;
        flex: 1;
      }
      .stepper-segment-active {
        background-color: #28a745; /* Green for completed segments */
      }
    </style>
  </head>

  <body
    class="bg-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <main
      id="main-content"
      role="main"
      class="container"
      style="max-width: 740px"
    >
      <div
        class="bg-white p-4 rounded-4 shadow-lg"
        style="width: 100%; max-width: 672px"
      >
        <!-- Header: Back Button and Close Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <!-- LEFT: Back Button  -->
          <a
            href="skill.html"
            class="text-secondary fw-bold text-decoration-none p-2 me-auto"
          >
            ← Back
          </a>

          <!-- CENTER -->
          <span class="mx-auto"></span>

          <!-- RIGHT: Close Button -->
          <a
            href="../profileDashboard.html"
            class="text-secondary fw-bold text-decoration-none"
            aria-label="Close"
          >
            Close
          </a>
        </div>

        <!-- STEPPER COMPONENT (Step 6 Active) -->
        <div class="stepper-new">
          <!-- Connecting Line Segments -->
          <div class="stepper-line">
            <!-- Segment 1, 2, 3, 4, 5: Completed (All segments green) -->
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
            <div class="stepper-line-segment stepper-segment-active"></div>
          </div>

          <!-- Step 1: Profile (Completed) -->
          <div class="stepper-step completed">
            <div class="stepper-circle">1</div>
            <div class="stepper-label">Profile</div>
          </div>

          <!-- Step 2: Contact (Completed) -->
          <div class="stepper-step completed">
            <div class="stepper-circle">2</div>
            <div class="stepper-label">Contact</div>
          </div>

          <!-- Step 3: Education (Completed) -->
          <div class="stepper-step completed">
            <div class="stepper-circle">3</div>
            <div class="stepper-label">Education</div>
          </div>

          <!-- Step 4: Experience (Completed) -->
          <div class="stepper-step completed">
            <div class="stepper-circle">4</div>
            <div class="stepper-label">Experience</div>
          </div>

          <!-- Step 5: Skill (Completed) -->
          <div class="stepper-step completed">
            <div class="stepper-circle">5</div>
            <div class="stepper-label">Skill</div>
          </div>

          <!-- Step 6: Availability (Active) -->
          <div class="stepper-step active">
            <div class="stepper-circle">6</div>
            <div class="stepper-label">Availability</div>
          </div>
        </div>
        <!-- END STEPPER COMPONENT -->

        <!-- Page Title -->
        <h1 class="h4 fw-bold text-dark mb-4 text-center">
          Availability / Preferences
        </h1>

        <!-- Form -->
        <form class="g-3" action="../profileDashboard.html" method="GET">
          <!-- Status -->
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <input
              id="status"
              name="status"
              type="text"
              placeholder="Ex: Assistant Store Manager"
              class="form-control"
            />
          </div>

          <!-- Location -->
          <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input
              id="location"
              name="location"
              type="text"
              placeholder="Ex: Shinigawa, Tokyo"
              class="form-control"
            />
          </div>

          <!-- Work Preferences -->
          <div class="mb-4">
            <label for="workPreferences" class="form-label"
              >Work Preferences</label
            >
            <input
              id="workPreferences"
              name="workPreferences"
              type="text"
              placeholder="Ex: full-time / shift-based / overtime OK"
              class="form-control"
            />
          </div>

          <!-- Buttons Section -->
          <div class="text-center">
            <a
              href="../profileDashboard.html"
              class="text-secondary text-decoration-underline d-block mb-3"
              >Skip</a
            >
            <button
              type="submit"
              class="btn btn-danger px-5 rounded-pill shadow-sm"
            >
              Save
            </button>
          </div>
        </form>
      </div>
    </main>

    <!-- Bootstrap JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Validation -->
    <script type="module">
      import { checkAuthAndRedirect } from "../../assets/js/modules/auth.js";
      import { initializeAvailabilityValidation } from "../../assets/js/modules/validation.js";
      import { getCookie } from "../../assets/js/modules/storage.js";
      import {
        saveUserProfile,
        getUserProfile,
        markProfileComplete,
      } from "../../assets/js/modules/userProfile.js";

      // Load existing availability data
      const loadAvailabilityData = () => {
        const profile = getUserProfile();

        if (profile.availability) {
          if (profile.availability.status) {
            document.getElementById("status").value =
              profile.availability.status;
          }
          if (profile.availability.location) {
            document.getElementById("location").value =
              profile.availability.location;
          }
          if (profile.availability.workPreferences) {
            document.getElementById("workPreferences").value =
              profile.availability.workPreferences;
          }
        }
      };

      // Build an ISO date string from separate year/month(/day) values.
      // Returns null if year or month are missing.
      const buildDate = (year, month, day = 1) => {
        const y = parseInt(year);
        const m = parseInt(month);
        const d = parseInt(day) || 1;
        if (!y || !m) return null;
        return new Date(y, m - 1, d).toISOString();
      };

      // Sync the fully-assembled localStorage profile to MongoDB via the API.
      // Each section is sent independently so a partial failure doesn't block the rest.
      const syncProfileToBackend = async (profile) => {
        const token = getCookie("token");
        if (!token) return;

        const headers = {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        };

        // ── 1. Basic profile ──────────────────────────────────────────
        const dob = profile.dateOfBirth;
        const dobDate = dob ? buildDate(dob.year, dob.month, dob.day) : null;

        const basicProfile = {
          ...(profile.firstName && { firstName: profile.firstName }),
          ...(profile.lastName  && { lastName:  profile.lastName  }),
          ...(dobDate           && { dateOfBirth: dobDate }),
          ...(profile.gender    && { gender: profile.gender.toLowerCase() }),
          ...(profile.nationality && { nationality: profile.nationality }),
          ...(profile.address   && { address:   profile.address   }),
          ...(profile.city      && { city:      profile.city      }),
          ...(profile.prefecture && { prefecture: profile.prefecture }),
          ...(profile.japaneseLevel && { japaneseLevel: profile.japaneseLevel }),
          ...(profile.profileSummary && { bio: profile.profileSummary }),
          // Store visa status and desired industry inside availability sub-doc
          availability: {
            ...(profile.visaStatus && { visaStatus: profile.visaStatus }),
            ...(profile.industry   && { desiredIndustry: profile.industry }),
          },
        };

        try {
          const res = await fetch("/api/v1/profile", {
            method: "POST",
            headers,
            body: JSON.stringify(basicProfile),
          });
          if (res.status === 400) {
            // Profile already exists — update instead
            await fetch("/api/v1/profile", {
              method: "PUT",
              headers,
              body: JSON.stringify(basicProfile),
            });
          }
        } catch (e) {
          console.warn("Could not sync basic profile to API:", e);
        }

        // ── 2. Education ──────────────────────────────────────────────
        if (profile.education && profile.education.length > 0) {
          for (const edu of profile.education) {
            if (!edu.schoolName || !edu.educationalAttainment) continue;
            const startDate = buildDate(edu.startYear, edu.startMonth) || new Date().toISOString();
            const endDate   = edu.currentlyStudying ? null : buildDate(edu.endYear, edu.endMonth || 12);
            const payload = {
              school:      edu.schoolName,
              degree:      edu.educationalAttainment,
              field:       edu.fieldOfStudy || "",
              startDate,
              ...(endDate && { endDate }),
              current:     !!edu.currentlyStudying,
              description: edu.description || "",
            };
            try {
              await fetch("/api/v1/profile/education", { method: "POST", headers, body: JSON.stringify(payload) });
            } catch (e) {
              console.warn("Could not sync education to API:", e);
            }
          }
        }

        // ── 3. Experience ─────────────────────────────────────────────
        if (profile.experience && profile.experience.length > 0) {
          for (const exp of profile.experience) {
            if (!exp.companyName || !exp.jobPosition) continue;
            const startDate = buildDate(exp.startYear, exp.startMonth) || new Date().toISOString();
            const endDate   = exp.currentlyWorking ? null : buildDate(exp.endYear, exp.endMonth || 12);
            const payload = {
              company:     exp.companyName,
              title:       exp.jobPosition,
              startDate,
              ...(endDate && { endDate }),
              current:     !!exp.currentlyWorking,
              description: exp.description || "",
            };
            try {
              await fetch("/api/v1/profile/experience", { method: "POST", headers, body: JSON.stringify(payload) });
            } catch (e) {
              console.warn("Could not sync experience to API:", e);
            }
          }
        }

        // ── 4. Skills ─────────────────────────────────────────────────
        if (profile.skills && profile.skills.length > 0) {
          const skillsPayload = {
            skills: profile.skills.map((s) =>
              typeof s === "string" ? { name: s, level: "intermediate" } : s
            ),
          };
          try {
            await fetch("/api/v1/profile/skills", { method: "PUT", headers, body: JSON.stringify(skillsPayload) });
          } catch (e) {
            console.warn("Could not sync skills to API:", e);
          }
        }

        // ── 5. Certifications ─────────────────────────────────────────
        if (profile.certifications && profile.certifications.length > 0) {
          const certPayload = {
            certifications: profile.certifications.map((c) =>
              typeof c === "string" ? { name: c, issuer: "N/A" } : c
            ),
          };
          try {
            await fetch("/api/v1/profile/certifications", { method: "PUT", headers, body: JSON.stringify(certPayload) });
          } catch (e) {
            console.warn("Could not sync certifications to API:", e);
          }
        }
      };

      // Save availability data on form submit then sync everything to MongoDB
      const saveAvailabilityData = async (event) => {
        event.preventDefault();

        const availabilityData = {
          availability: {
            status: document.getElementById("status").value,
            location: document.getElementById("location").value,
            workPreferences: document.getElementById("workPreferences").value,
          },
        };

        saveUserProfile(availabilityData);
        markProfileComplete();

        // Sync all profile steps to MongoDB Atlas
        const fullProfile = getUserProfile();
        await syncProfileToBackend(fullProfile);

        window.location.href = "../profileDashboard.html";
      };

      window.addEventListener("DOMContentLoaded", () => {
        checkAuthAndRedirect();
        initializeAvailabilityValidation();
        loadAvailabilityData();

        const form = document.querySelector("form");
        if (form) {
          form.addEventListener("submit", saveAvailabilityData);
        }
      });
    </script>
  </body>
</html>

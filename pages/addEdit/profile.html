<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../../assets/css/main.css">
    
    <!-- Stepper Styles  -->
    <style>
      .stepper-new {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 2rem;
        padding: 1rem 0;
        position: relative;
      }
      .stepper-step {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        flex: 0 0 auto;
        z-index: 2;
      }
      .stepper-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background-color: #e9ecef; /* Incomplete */
        color: #6c757d;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 600;
        border: 2px solid #e9ecef;
        transition: all 0.3s;
      }
      .stepper-step.active .stepper-circle {
        background-color: #dc3545; /* Active (Red) */
        color: white;
        border-color: #dc3545;
      }
      .stepper-step.completed .stepper-circle {
        background-color: #28a745; /* Completed (Green) */
        color: white;
        border-color: #28a745;
      }
      .stepper-label {
        margin-top: 0.5rem;
        font-size: 0.75rem; /* Small font size for labels */
        color: #6c757d;
        font-weight: 500;
        transition: color 0.3s;
      }
      .stepper-step.active .stepper-label {
        color: #343a40;
        font-weight: 700;
      }
      .stepper-line {
        position: absolute;
        height: 2px;
        background-color: #e9ecef; /* Incomplete Line */
        top: 25px;
        left: 20px;
        right: 20px;
        margin-left: 1rem;
        margin-right: 1rem;
        width: calc(100% - 40px);
        z-index: 1;
        display: flex;
        justify-content: space-between;
      }
      .stepper-line-segment {
          height: 2px;
          background-color: #e9ecef;
          flex: 1;
      }
      .stepper-segment-active {
          background-color: #28a745; /* Green for completed segments */
      }
    </style>

    </head>
    <body class="bg-light"> 

      <main id="main-content" role="main" class="bg-white p-4 rounded-3 shadow mx-auto my-4" style="width: 100%; max-width: 672px;">
        <!-- HEADER: Back Button and Close Button -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <!-- LEFT: Back Button (Hidden on first page using d-none) -->
            <a href="#" class="text-secondary fw-bold text-decoration-none p-2 me-auto d-none">
                ← Back 
            </a>
            
            <!-- CENTER: Used for spacing -->
            <span class="mx-auto"></span>
            
            <!-- RIGHT: Close Button -->
            <a href="../../index.html" class="text-secondary fw-bold text-decoration-none p-2 ms-auto">
              Close
            </a>
        </div>

        <!-- STEPPER COMPONENT (Step 1 Active) -->
        <div class="stepper-new">
          <div class="stepper-line">
              <!-- Segment 1: Incomplete -->
              <div class="stepper-line-segment"></div>
              <!-- Remaining 4 Segments: Incomplete -->
              <div class="stepper-line-segment"></div>
              <div class="stepper-line-segment"></div>
              <div class="stepper-line-segment"></div>
              <div class="stepper-line-segment"></div>
          </div>

          <!-- Step 1: Profile (Active) -->
          <div class="stepper-step active">
            <div class="stepper-circle">1</div>
            <div class="stepper-label">Profile</div>
          </div>

          <!-- Step 2: Contact (Incomplete) -->
          <div class="stepper-step">
            <div class="stepper-circle">2</div>
            <div class="stepper-label">Contact</div>
          </div>

          <!-- Step 3: Education (Incomplete) -->
          <div class="stepper-step">
            <div class="stepper-circle">3</div>
            <div class="stepper-label">Education</div>
          </div>
          
          <!-- Step 4: Experience (Incomplete) -->
          <div class="stepper-step">
            <div class="stepper-circle">4</div>
            <div class="stepper-label">Experience</div>
          </div>

          <!-- Step 5: Skill (Incomplete) -->
          <div class="stepper-step">
            <div class="stepper-circle">5</div>
            <div class="stepper-label">Skill</div>
          </div>

          <!-- Step 6: Availability (Incomplete) -->
          <div class="stepper-step">
            <div class="stepper-circle">6</div>
            <div class="stepper-label">Availability</div>
          </div>
        </div>
        <!-- END STEPPER COMPONENT -->

          <!-- Page Title -->
          <h1 class="h4 fw-bold text-dark mb-4 text-center">Profile</h1>

      <form class="g-4" id="profileForm" action="contact.html" method="GET">
        
        <!-- Name Section -->
        <div class="mb-3">
          <label for="firstName" class="form-label">First Name*</label>
          <input id="firstName" name="firstName" type="text" placeholder="Ex: Juan" required="" class="form-control">
        </div>

        <div class="mb-3">
          <label for="middleName" class="form-label">Middle Name</label>
          <input id="middleName" name="middleName" type="text" placeholder="Ex: Santiago" class="form-control">
        </div>

        <div class="mb-3">
          <label for="lastName" class="form-label">Last Name*</label>
          <input id="lastName" name="lastName" type="text" placeholder="Ex: Dela Cruz" required="" class="form-control">
        </div>

        <!-- DOB Section -->
        <div class="mb-3">
          <label class="form-label">Date of Birth</label>
            
        <div class="d-flex g-2">
            <select id="dobDay" name="dobDay" class="form-select me-2" aria-label="Profile select">
                <option value="">Day</option>
            </select>
          
            <select id="dobMonth" name="dobMonth" class="form-select me-2" aria-label="Profile select">
                <option value="">Month</option>
            </select>

            <select id="dobYear" name="dobYear" class="form-select" aria-label="Profile select">
                <option value="">Year</option>
            </select>
        </div>
        <div id="dobFeedback" style="display: none;" class="text-danger mt-1">
            </div>
    </div>

        <!-- Gender Section -->
        <div class="mb-3">
            <div class="row gx-3 mb-1">
                <label for="genderSelect" class="col-6 form-label">Gender</label>
                <label for="nationalitySelect" class="col-6 form-label">Nationality</label>
            </div>
            <div class="row gx-3">
                <div class="col-6">
                    <select id="genderSelect" class="form-select">
                        <option>Select Gender</option>
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>
                <div class="col-6">
                    <select id="nationalitySelect" class="form-select">
                        </select>
                </div>
            </div>
        </div>
        <!-- Location Section -->
        <div class="mb-3">
          <label for="location" class="form-label">Location*</label>
          <input id="location" name="location" type="text" placeholder="Ex: Japan" required="" class="form-control">
        </div>

        <div class="mb-3">
          <label for="city" class="form-label">City*</label>
          <input id="city" name="city" type="text" placeholder="Ex: Osaka" required="" class="form-control">
        </div>

        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <textarea id="address" name="address" rows="3" placeholder="Ex: street, building name, number" class="form-control"></textarea>
        </div>

        <div class="mb-3">
          <label for="field" class="form-label">Field*</label>
          <select id="field" name="field" required="" class="form-select">
            <option>Accommodation</option>
            <option>Agriculture</option>
            <option>Automobile</option>
            <option>Automobile Transportation</option>
            <option>Aviation</option>
            <option>Building Cleaning</option>
            <option>Construction</option>
            <option>Fishery/Aquaculture</option>
            <option>Food and Beverages</option>
            <option>Food Services</option>
            <option>Forestry</option>
            <option>Industrial Product</option>
            <option>Nursing Care</option>
            <option>Railway</option>
            <option>Shipbuilding</option>
            <option>Wood Industry</option>
          </select>
        </div>

        <!-- Prometric Test Section -->
        <div class="mb-3">
          <label for="prometricTest" class="form-label">Prometric Test*</label>
          <select id="prometricTest" name="prometricTest" required="" class="form-select">
            <option>Accommodation Industry Proficiency Test</option>
            <option>Agriculture Skill Assessment Test</option>
            <option>
              Automobile Repair and Maintenance Field Specified Skills
              Evaluation Test
            </option>
            <option>Aviation Specified Skills Evaluation Test</option>
            <option>
              Building Cleaning Management Field Specified Skilled Worker
              Evaluation Test
            </option>
            <option>
              Construction Field Specified Skilled Worker Evaluation Test
            </option>
            <option>Fishing Industry Skills Proficiency Test</option>
            <option>
              Food and Beverage Manufacturing Industry Specified Skills
              Evaluation Test
            </option>
            <option>
              Food Service Industry Specified Skills Evaluation Test
            </option>
            <option>
              Industrial Product Manufacturing Specified Skills Evaluation Test
            </option>
            <option>Nippon Kaiji Kyokai</option>
            <option>Nursing Care Skills Evaluation Test</option>
            <option>Nursing Care Japanese Language Evaluation Test</option>
            <option>Not Applicable</option>
          </select>
        </div>

        <!-- JLPT Section -->        
        <div class="mb-3">
          <label for="jlptLevel" class="form-label">JLPT level*</label>
          <select id="jlptLevel" name="jlptLevel" required="" class="form-select">
            <option>N5 level</option>
            <option>N4 level</option>
            <option>N3 level</option>
            <option>N2 level</option>
            <option>N1 level</option>
          </select>
        </div>

        <!-- Visa Type & Expiry Date Section -->        
        <div class="mb-3">
              <label for="visaType" class="form-label">Visa Type</label>
              <select id="visaType" class="form-select">
                  <option value="">Select Visa Type</option>
                  <option>Engineer / Specialist in Humanities / International Services Visa</option>
                  <option>Skilled Labor Visa</option>
                  <option>Business Manager Visa</option>
                  <option>Intra-Company Transferee Visa</option>
                  <option>Highly Skilled Professional (I &amp; II) Visa</option>
                  <option>Specified Skilled Worker (I &amp; II) Visa</option>
                  <option>Technical Intern Training Visa</option>
                  <option>Entertainer Visa</option>
                  <option>Student Visa</option>
                  <option>Long-Term Resident Visa</option>
                  <option>Permanent Resident Visa</option>
              </select>
        </div>

        <div class="mb-3">
            <label for="visaExpiryDate" class="form-label">Visa Expiry Date (YYYY/MM)</label>
            <input id="visaExpiryDate" name="visaExpiryDate" type="month" placeholder="YYYY/MM" class="form-control">
        </div>

        <!-- Buttons Section -->
      <!-- Buttons -->
      <div class="text-center">
        <a href="contact.html" class="text-secondary text-decoration-underline d-block mb-3">Skip</a>
        <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">Save</button>
      </div>
    </form>
    </main>

      const populateNationalitySelect = () => {
        const select = document.getElementById('nationalitySelect');
        if (!select) return; 

        // Default placeholder option
        const defaultOption = document.createElement('option');
        defaultOption.value = "";
        defaultOption.textContent = "Select Nationality";
        select.appendChild(defaultOption);

        // Add all nationalities from the array
        NATIONALITIES.forEach(nationality => {
          const option = document.createElement('option');

      // INITIALIZATION
      window.addEventListener('DOMContentLoaded', () => {

</body></html>

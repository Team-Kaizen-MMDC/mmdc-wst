<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add/Edit Education</title>

  <!-- Bootstrap 5.3.3 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>

<body class="bg-light py-5">

  <div class="container" style="max-width: 740px;">
    <div class="bg-white p-4 rounded-4 shadow-lg"
          style="width: 100%; max-width: 672px;">
      
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 fw-bold text-dark mb-0">Education</h1>
        <a href="../../index.html" class="text-secondary fw-semibold text-decoration-none">Close</a>
      </div>

      <!-- Form -->
      <form id="educationForm" action="experience.html" method="GET" novalidate>
        
        <!-- School -->
        <div class="mb-3">
          <label for="school" class="form-label">School*</label>
          <input 
            id="school"
            name="school"
            type="text"
            placeholder="Ex: Mapua University"
            required
            class="form-control"
          />
        </div>

        <!-- Degree -->
        <div class="mb-3">
          <label for="degree" class="form-label">Degree*</label>
          <select id="degree" name="degree" class="form-select" required>
            <option value="">Please Select</option>
            <option>Associate Degree</option>
            <option>Bachelor's Degree</option>
            <option>Master's Degree</option>
            <option>Doctoral Degree</option>
            <option>High School Diploma or Equivalent</option>
          </select>
        </div>

        <!-- Field of Study -->
        <div class="mb-3">
          <label for="field" class="form-label">Field of study*</label>
          <input
            id="field"
            name="field"
            type="text"
            placeholder="Ex: Software Development"
            required
            class="form-control"
          />
        </div>

        <!-- Start Date -->
        <div class="mb-4">
          <label for="startMonth" class="form-label">Start Date*</label>
          <div class="row g-2">
            <div class="col">
              <select id="startMonth" name="startMonth" class="form-select" required>
                <option value="">Month</option>
              </select>
            </div>
            <div class="col">
              <select id="startYear" name="startYear" class="form-select" required>
                <option value="">Year</option>
              </select>
            </div>
          </div>
          <div id="startMonthFeedback" class="invalid-feedback d-block mt-1" style="display:none;"></div>
        </div>

        <!-- End Date -->
        <div class="mb-4" id="endDateWrapper">
          <label for="endMonth" class="form-label">End Date*</label>
          <div class="row g-2" id="endDateSelects">
            <div class="col">
              <select id="endMonth" name="endMonth" class="form-select">
                <option value="">Month</option>
              </select>
            </div>
            <div class="col">
              <select id="endYear" name="endYear" class="form-select">
                <option value="">Year</option>
              </select>
            </div>
          </div>
          <input
            id="currentDateField"
            type="text"
            value="Current"
            disabled
            class="form-control bg-light text-secondary mt-2"
            style="display:none;"
          />
        </div>

        <!-- Checkbox -->
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="CurrentlyStudying" name="CurrentlyStudying">
          <label class="form-check-label" for="CurrentlyStudying">
            I currently study here
          </label>
        </div>

        <!-- Grades -->
        <div class="mb-3">
          <label for="grades" class="form-label">Grades</label>
          <input
            id="grades"
            name="grades"
            type="text"
            placeholder="Ex: 1.5"
            class="form-control"
          />
        </div>

        <!-- Activities -->
        <div class="mb-3">
          <label for="activities" class="form-label">Activities</label>
          <input
            id="activities"
            name="activities"
            type="text"
            placeholder="Ex: Tennis Omega"
            class="form-control"
          />
        </div>

        <!-- Description -->
        <div class="mb-4">
          <label for="description" class="form-label">Description</label>
          <textarea
            id="description"
            name="description"
            rows="4"
            placeholder="List your duties and responsibilities"
            class="form-control"
          ></textarea>
        </div>

        <!-- Buttons -->
        <div class="text-center">
          <a href="experience.html" class="text-secondary text-decoration-underline d-block mb-3">Skip</a>
          <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validation JS -->
  <script type="module">
    import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js';
    import { initializeEducationValidation } from '../../assets/js/modules/validation.js';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuthAndRedirect();
      initializeEducationValidation();
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add/Edit Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">

  <!-- Stepper Styles -->
  <style>
    .stepper-new {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2rem;
      padding: 1rem 0;
      position: relative;
    }
    .stepper-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 0 0 auto;
      z-index: 2;
    }
    .stepper-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #e9ecef; /* Incomplete */
      color: #6c757d;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 600;
      border: 2px solid #e9ecef;
      transition: all 0.3s;
    }
    .stepper-step.active .stepper-circle {
      background-color: #dc3545; /* Active (Red) */
      color: white;
      border-color: #dc3545;
    }
    .stepper-step.completed .stepper-circle {
      background-color: #28a745; /* Completed (Green) */
      color: white;
      border-color: #28a745;
    }
    .stepper-label {
      margin-top: 0.5rem;
      font-size: 0.75rem; /* Small font size for labels */
      color: #6c757d;
      font-weight: 500;
      transition: color 0.3s;
    }
    .stepper-step.active .stepper-label {
      color: #343a40;
      font-weight: 700;
    }
    .stepper-line {
      position: absolute;
      height: 2px;
      background-color: #e9ecef;
      top: 25px;
      left: 20px;
      right: 20px;
      margin-left: 1rem;
      margin-right: 1rem;
      width: calc(100% - 40px);
      z-index: 1;
      display: flex;
      justify-content: space-between;
    }
    .stepper-line.completed > div {
        background-color: #28a745; /* Completed Line (Green) */
    }

    /* Spacing fixes for Mobile responsiveness */
    .stepper-step:first-child { margin-left: 0; }
    .stepper-step:last-child { margin-right: 0; }

    /* Custom line for 6 steps - 5 segments */
    .stepper-line-segment {
        height: 2px;
        background-color: #e9ecef;
        flex: 1;
    }
    .stepper-segment-active {
        background-color: #28a745; /* Green for completed segments */
    }
  </style>
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container" style="max-width:740px;">
    <div class="bg-white p-4 rounded-4 shadow-lg" style="width: 100%; max-width: 672px;">

      <!-- Header : Back Button and Close Button-->
      <div class="d-flex justify-content-between align-items-center mb-4">
      
          <!-- LEFT: Back Button  -->
          <a href="profile.html" class="text-secondary fw-bold text-decoration-none p-2 me-auto">
              ← Back 
          </a>

          <!-- CENTER -->
          <span class="mx-auto"></span> 
          
        <!-- RIGHT: Close Button -->
        <a href="../../index.html" class="text-secondary fw-bold text-decoration-none p-2 ms-auto">Close</a>
      </div>
        
      <!-- STEPPER COMPONENT  -->
      <div class="stepper-new">
        <div class="stepper-line">
            <!-- Segment 1: Completed (from Profile to Contact) -->
            <div class="stepper-line-segment stepper-segment-active"></div>
            <!-- Remaining 4 Segments: Incomplete -->
            <div class="stepper-line-segment"></div>
            <div class="stepper-line-segment"></div>
            <div class="stepper-line-segment"></div>
            <div class="stepper-line-segment"></div>
        </div>

        <!-- Step 1: Profile (Completed) -->
        <div class="stepper-step completed">
          <div class="stepper-circle">1</div>
          <div class="stepper-label">Profile</div>
        </div>

        <!-- Step 2: Contact (Active) -->
        <div class="stepper-step active">
          <div class="stepper-circle">2</div>
          <div class="stepper-label">Contact</div>
        </div>

        <!-- Step 3: Education (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">3</div>
          <div class="stepper-label">Education</div>
        </div>
        
        <!-- Step 4: Experience (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">4</div>
          <div class="stepper-label">Experience</div>
        </div>

        <!-- Step 5: Skill (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">5</div>
          <div class="stepper-label">Skill</div>
        </div>

        <!-- Step 6: Availability (Incomplete) -->
        <div class="stepper-step">
          <div class="stepper-circle">6</div>
          <div class="stepper-label">Availability</div>
        </div>
      </div>
      <!-- END STEPPER COMPONENT -->

      <!-- Page Title  -->
      <h1 class="h4 fw-bold text-dark mb-4 text-center">Contact</h1>

      <!-- Form -->
      <form id="contactForm" action="education.html" method="GET" novalidate="">
        
        <!-- Mobile Number 1 -->
        <div class="mb-3">
          <label for="mobile1" class="form-label">Mobile Number</label>
          <input id="mobile1" name="mobile1" type="text" placeholder="Ex: 0995-213-1231" class="form-control">
        </div>

        <!-- Japan Number checkbox -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="currentWork" name="currentWork">
          <label class="form-check-label" for="currentWork">Japan Number</label>
        </div>

        <!-- Mobile Number 2 -->
        <div class="mb-3">
          <label for="mobile2" class="form-label">Mobile Number</label>
          <input id="mobile2" name="mobile2" type="text" placeholder="Ex: 081-1312-131241" class="form-control">
        </div>

        <!-- Email Address -->
        <div class="mb-4">
          <label for="email" class="form-label">Email*</label>
          <input id="email" name="email" type="text" placeholder="Ex: juan0515@gmail.com" class="form-control">
        </div>

        <!-- Buttons -->
        <div class="text-center">
          <a href="education.html" class="text-secondary text-decoration-underline d-block mb-3">
            Skip
          </a>
          <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validation -->
  <script type="module">
    import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js';
    import { initializeContactValidation } from '../../assets/js/modules/validation.js';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuthAndRedirect();
      initializeContactValidation();
    });
  </script>


<main id="main-content"></main></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add/Edit Contact</title>

  <!-- Bootstrap 5.3.3 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="container" style="max-width:740px;">
    <div class="bg-white p-4 rounded-4 shadow-lg"
          style="width: 100%; max-width: 672px;">

      <!-- Header -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 fw-bold text-dark mb-0">Contact</h1>
        <a href="../../index.html" class="text-secondary fw-semibold text-decoration-none">Close</a>
      </div>

      <!-- Form -->
      <form id="contactForm" action="education.html" method="GET" novalidate>
        
        <!-- Mobile Number 1 -->
        <div class="mb-3">
          <label for="mobile1" class="form-label">Mobile Number</label>
          <input
            id="mobile1"
            name="mobile1"
            type="text"
            placeholder="Ex: 0995-213-1231"
            class="form-control"
          />
        </div>

        <!-- Japan Number checkbox -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="currentWork" name="currentWork" />
          <label class="form-check-label" for="currentWork">Japan Number</label>
        </div>

        <!-- Mobile Number 2 -->
        <div class="mb-3">
          <label for="mobile2" class="form-label">Mobile Number</label>
          <input
            id="mobile2"
            name="mobile2"
            type="text"
            placeholder="Ex: 081-1312-131241"
            class="form-control"
          />
        </div>

        <!-- Email Address -->
        <div class="mb-4">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            name="email"
            type="text"
            placeholder="Ex: juan0515@gmail.com"
            class="form-control"
          />
        </div>

        <!-- Buttons -->
        <div class="text-center">
          <a href="education.html" class="text-secondary text-decoration-underline d-block mb-3">
            Skip
          </a>
          <button type="submit" class="btn btn-danger px-5 rounded-pill shadow-sm">
            Save
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validation -->
  <script type="module">
    import { checkAuthAndRedirect } from '../../assets/js/modules/auth.js';
    import { initializeContactValidation } from '../../assets/js/modules/validation.js';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuthAndRedirect();
      initializeContactValidation();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Details</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../../assets/css/main.css" />
</head>
<body>

  <main id="main-content" class="py-5 bg-light">
    <div class="container">
      <div id="companyDetailContent">
        <header class="card shadow-sm rounded-4 border-0 mb-4 overflow-hidden">
          <div class="card-body p-4 p-md-5">
            <div class="row align-items-center g-4">
              <div class="col-md-auto text-center">
                <img
                  id="det-logo"
                  src=""
                  alt=""
                  class="rounded-4 border shadow-sm bg-white p-3"
                  style="width: 130px; height: 130px; object-fit: contain;"
                />
              </div>

              <div class="col">
                <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                  <h1 id="det-name" class="h2 fw-bold mb-0">Loading...</h1>
                  <span id="det-verified" class="badge text-bg-success d-none">Verified</span>
                </div>

                <p id="det-meta" class="text-muted fs-6 mb-3">Industry • Location</p>
                <p id="det-short-description" class="text-secondary lh-lg mb-4">
                  Loading company summary...
                </p>

                <div class="d-flex flex-wrap gap-2">
                  <a
                    id="det-website"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="btn btn-danger rounded-pill px-4"
                  >
                    Visit Website
                  </a>


                <div id="adminEditActions" class="d-none">
                <button id="adminEditBtn" class="btn btn-outline-primary rounded-pill px-4">
                  Edit Company
                </button>

              <button id="saveCompanyBtn" class="btn btn-primary rounded-pill px-4 d-none">
                Save
              </button>

              <button id="cancelEditBtn" class="btn btn-light rounded-pill px-4 d-none">
                Cancel
              </button>

              </div>
              
                </div>
              </div>
            </div>

            <div class="row g-3 mt-4">
              <div class="col-6 col-md-3">
                <div class="bg-light rounded-4 p-3 h-100 border">
                  <small class="text-muted d-block mb-1">Open Jobs</small>
                  <span id="det-open-jobs" class="fw-bold fs-5">0</span>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="bg-light rounded-4 p-3 h-100 border">
                  <small class="text-muted d-block mb-1">Industry</small>
                  <span id="det-industry-stat" class="fw-bold fs-6">—</span>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="bg-light rounded-4 p-3 h-100 border">
                  <small class="text-muted d-block mb-1">Headquarters</small>
                  <span id="det-location-stat" class="fw-bold fs-6">—</span>
                </div>
              </div>
              <div class="col-6 col-md-3">
                <div class="bg-light rounded-4 p-3 h-100 border">
                  <small class="text-muted d-block mb-1">Founded</small>
                  <span id="det-founded-stat" class="fw-bold fs-6">—</span>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div class="row g-4">
          <div class="col-lg-8">
            <section class="card shadow-sm rounded-4 border-0 mb-4">
              <div class="card-body p-4">
                <h2 class="h5 fw-bold mb-3">About the Company</h2>
                <div id="det-description" class="text-secondary lh-lg"></div>
              </div>
            </section>

            <section id="companyActiveJobsSection" class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 fw-bold mb-0">Active Job Openings</h2>
                <span class="text-muted small">
                  <span id="det-job-count-text">0</span> jobs available
                </span>
              </div>

              <div id="companyActiveJobs" class="row g-3"></div>
            </section>
          </div>

          <aside class="col-lg-4">
            <div class="card shadow-sm rounded-4 border-0 sticky-lg-top" style="top: 2rem;">
              <div class="card-body p-4">
                <h3 class="h6 fw-bold text-uppercase mb-4">Company Overview</h3>

                <div class="mb-3">
                  <label class="small text-muted d-block">Headquarters</label>
                  <span id="det-location" class="fw-semibold text-dark">—</span>
                </div>

                <div class="mb-3">
                  <label class="small text-muted d-block">Industry Sector</label>
                  <span id="det-industry" class="fw-semibold text-dark">—</span>
                </div>

                <div class="mb-3">
                  <label class="small text-muted d-block">Founded</label>
                  <span id="det-founded" class="fw-semibold text-dark">—</span>
                </div>

                <div class="mb-3">
                  <label class="small text-muted d-block">Company Size</label>
                  <span id="det-size" class="fw-semibold text-dark">—</span>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script src="../../assets/js/features/companyDetails.js"></script>
</body>
</html>

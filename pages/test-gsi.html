<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="origin" />
    <title>Google Sign-In (GSI) Test</title>
    <style>
      body {
        font-family: Inter, system-ui, Arial, sans-serif;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Google Identity Services — Test</h1>
    <p>
      This page loads the GSI button for origin validation. Replace the
      <em>data-client_id</em> value with a different client ID if you create a
      new one.
    </p>

    <div
      id="g_id_onload"
      data-client_id=""
      data-callback="onGoogleSignIn"
      data-auto_prompt="false"
    ></div>

    <div class="g_id_signin"></div>

    <script>
      function onGoogleSignIn(response) {
        console.log("GSI callback response:", response);
        var out = document.createElement("pre");
        out.textContent = JSON.stringify(response, null, 2);
        document.body.appendChild(out);
      }
    </script>

    <script>
      (async function () {
        try {
          const resp = await fetch("/config");
          const cfg = await resp.json();
          const onloadDiv = document.getElementById("g_id_onload");
          if (onloadDiv && cfg && cfg.googleClientId) {
            onloadDiv.setAttribute("data-client_id", cfg.googleClientId);
          }
          // Log and show the final client_id value before loading GSI
          console.log('Resolved g_id_onload data-client_id =>', (onloadDiv && onloadDiv.getAttribute('data-client_id')) || cfg.googleClientId);
          try {
            const dbg = document.createElement('div');
            dbg.textContent = 'Google client: ' + ((onloadDiv && onloadDiv.getAttribute('data-client_id')) || cfg.googleClientId || '(none)');
            dbg.style.cssText = 'position:fixed;bottom:8px;right:8px;background:#fff;border:1px solid #ddd;padding:6px 8px;font-size:12px;z-index:9999;box-shadow:0 2px 6px rgba(0,0,0,0.08);';
            document.body.appendChild(dbg);
          } catch (e) {}
          // Notify server of the intended GSI request for debugging
          try {
            await fetch('/debug/log-gsi', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                clientId: (onloadDiv && onloadDiv.getAttribute('data-client_id')) || cfg.googleClientId || null,
                origin: window.location.origin,
                href: window.location.href,
                referrer: document.referrer || null,
              }),
            });
          } catch (e) {
            console.warn('Failed to send GSI debug log', e);
          }
          const s = document.createElement("script");
          s.src = "https://accounts.google.com/gsi/client";
          s.async = true;
          s.defer = true;
          document.head.appendChild(s);
        } catch (err) {
          console.error("Failed to fetch /config for Google client id", err);
        }
      })();
    </script>
  </body>
</html>

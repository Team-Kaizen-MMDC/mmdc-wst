name: Playwright Smoke Tests (Chromium)

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    pull-requests: write

jobs:
    playwright-smoke:
        name: Run Playwright smoke (Chromium)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Fail on leading '/pages/' hrefs
              run: |
                  set -euo pipefail
                  echo "Searching repo for offending hrefs like href=\"/pages/...\""
                  # Use git grep to find instances; fall back to grep if git grep isn't available
                  if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                    matches=$(git grep -n --line-number 'href="/pages/' || true)
                  else
                    matches=$(grep -RIn --exclude-dir=.git 'href="/pages/' || true)
                  fi
                  if [ -n "$matches" ]; then
                    echo "Found leading '/pages/' hrefs (these will break on GitHub Pages):"
                    echo "$matches"
                    echo "Please replace leading '/pages/' with relative 'pages/'."
                    exit 1
                  fi
                  echo "No offending '/pages/' hrefs found."

            - name: Use Node.js 18
              uses: actions/setup-node@v4
              with:
                  node-version: 18

            - name: Install dependencies
              run: |
                  npm ci

            - name: Install Playwright browsers
              run: |
                  npx playwright install --with-deps

            - name: Start static server
              run: |
                  python3 -m http.server 8000 > /tmp/mmdc-wst-http.log 2>&1 &
                  echo $! > /tmp/mmdc-wst-server.pid
                  sleep 1

            - name: Run smoke tests (chromium)
              id: run-tests
              run: |
                  set -e
                  # Capture Playwright output to a log so we can extract a concise summary
                  echo "Running smoke tests and teeing output to /tmp/playwright-run.log"
                  ./run-tests.sh smoke chromium --no-server 2>&1 | tee /tmp/playwright-run.log || true
              continue-on-error: true

            - name: Upload Playwright results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results
                  path: |
                      tests/playwright/tests/playwright/results/**
                      test-results/**
                      tests/playwright/**/trace.zip
                      tests/playwright/**/screenshots/**
                      /tmp/playwright-run.log
                      /tmp/mmdc-wst-http.log

            - name: Post PR comment with summary
              if: always()
              uses: actions/github-script@v6
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  script: |
                      const { execSync } = require('child_process');
                      const fs = require('fs');

                      function safeRead(path) {
                        try { return fs.readFileSync(path, 'utf8'); } catch (e) { return null; }
                      }

                      // Try to read Playwright's HTML summary (if produced)
                      const reportPath = 'tests/playwright/tests/playwright/results/index.html';
                      const reportExists = fs.existsSync(reportPath);

                      const summary = [];
                      summary.push('Playwright smoke tests (Chromium) run on this pull request.');
                      summary.push('');
                      if (reportExists) {
                        summary.push(`HTML report was generated and uploaded as part of the 'playwright-results' artifact.`);
                      } else {
                        summary.push('No HTML report was generated. Raw Playwright artifacts were uploaded (trace/screenshot).');
                      }

                      // Try to include a short textual summary from the test runner log
                      const logPaths = ['/tmp/mmdc-wst-http.log','/tmp/playwright-run.log'];
                      let tail = '';
                      for (const p of logPaths) {
                        const v = safeRead(p);
                        if (v) { tail += `\n--- ${p} (tail) ---\n` + v.split('\n').slice(-200).join('\n'); }
                      }

                      // Try to extract short PASS/FAIL summary from the Playwright run log
                      let passed = 0, failed = 0, flaky = 0, total = 0;
                      try {
                        const runLog = safeRead('/tmp/playwright-run.log') || '';
                        // Look for lines like: "103 passed (21.6s)" or "1 failed, 102 passed"
                        const passMatch = runLog.match(/(\d+)\s+passed/);
                        const failMatch = runLog.match(/(\d+)\s+failed/);
                        const totalMatch = runLog.match(/Running\s+(\d+)\s+tests/);
                        if (passMatch) passed = parseInt(passMatch[1],10);
                        if (failMatch) failed = parseInt(failMatch[1],10);
                        if (totalMatch) total = parseInt(totalMatch[1],10);
                        // Fallback: try to infer total as passed+failed
                        if (!total && (passed || failed)) total = passed + failed;
                      } catch (e) {
                        console.log('Failed to parse playwright-run.log:', e.message || e);
                      }

                      const statusLine = (typeof total === 'number' && total > 0)
                        ? `Test summary: ${total} total, ${passed} passed, ${failed} failed.`
                        : 'Test summary: Could not determine counts from run log.';

                      // Try to find the uploaded artifact for this run and include a download URL
                      const runId = context.runId;
                      let artifactUrl = null;
                      try {
                        const resp = await github.actions.listWorkflowRunArtifacts({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          run_id: runId,
                        });
                        const artifacts = resp.data && resp.data.artifacts ? resp.data.artifacts : [];
                        const found = artifacts.find(a => a.name === 'playwright-results');
                        if (found) {
                          artifactUrl = found.archive_download_url;
                        }
                      } catch (e) {
                        console.log('Failed to list artifacts for run:', e.message || e);
                      }

                      let body = summary.join('\n') + '\n\n' + statusLine + '\n\n' + (tail || 'No runner logs available.');
                      if (artifactUrl) {
                        body += `\n\nDownload artifacts (requires repository access): ${artifactUrl}`;
                      } else {
                        body += `\n\nNo 'playwright-results' artifact was found in this run.`;
                      }

                      // Post comment on the PR
                      const prNumber = context.payload.pull_request && context.payload.pull_request.number;
                      if (!prNumber) {
                        console.log('No pull request number found in context; skipping comment.');
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: prNumber,
                          body,
                        });
                      }

name: Playwright Smoke Tests (Chromium)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright-smoke:
    name: Run Playwright smoke (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for leading '/pages/' hrefs (warn only)
        run: |
          set -euo pipefail
          echo "Searching repo for offending hrefs like href=\"/pages/...\" in HTML files (warn only)"
          # Limit search to HTML files and pages/ content to avoid matching CSS or workflow files
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            matches=$(git grep -n --line-number 'href="/pages/' -- '*.html' 'pages/**' || true)
          else
            matches=$(grep -RIn --exclude-dir=.git --include='*.html' 'href="/pages/' || true)
          fi
          if [ -n "$matches" ]; then
            echo "WARNING: Found leading '/pages/' hrefs (these will break on GitHub Pages):"
            echo "$matches"
            echo "Please replace leading '/pages/' with relative 'pages/'."
            # Do not fail the job; just warn so tests continue
          else
            echo "No offending '/pages/' hrefs found in HTML files."
          fi

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers (Chromium only)
        run: |
          # install only Chromium to speed up the workflow
          npx playwright install chromium

      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/mmdc-wst-http.log 2>&1 &
          echo $! > /tmp/mmdc-wst-server.pid
          sleep 1

      - name: Run smoke tests (chromium)
        id: run-tests
        run: |
          set -e
          # Run smoke tests - Playwright will generate JSON report via config
          echo "Running smoke tests"
          mkdir -p test-results
          ./run-tests.sh smoke chromium --no-server 2>&1 | tee /tmp/playwright-run.log || true
        continue-on-error: true

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests/playwright/tests/playwright/results/**
            # include any Playwright JSON report files so CI can parse exact counts
            tests/playwright/tests/playwright/results/**/*.json
            test-results/**
            tests/playwright/**/trace.zip
            tests/playwright/**/screenshots/**
            /tmp/playwright-run.log
            /tmp/mmdc-wst-http.log

      - name: Post PR comment with summary
        if: always()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            function safeRead(p) {
              try { return fs.readFileSync(p, 'utf8'); } catch (e) { return null; }
            }

            const summaryLines = [];
            summaryLines.push('## 🧪 Playwright Smoke Tests (Chromium)');
            summaryLines.push('');

            // Parse Playwright JSON results from test-results/results.json
            const resultsPath = path.join(process.cwd(), 'test-results', 'results.json');
            console.log('Looking for results at:', resultsPath);
            console.log('File exists:', fs.existsSync(resultsPath));

            let parsed = false;
            let total = 0, passed = 0, failed = 0, skipped = 0, flaky = 0;

            try {
              const resultsContent = safeRead(resultsPath);
              if (resultsContent) {
                console.log('Results file content length:', resultsContent.length);
                const data = JSON.parse(resultsContent);
                console.log('Parsed JSON, has suites:', Array.isArray(data.suites));
                
                // Playwright JSON reporter structure
                if (data && Array.isArray(data.suites)) {
                  const walk = (suite) => {
                    if (!suite) return;
                    if (Array.isArray(suite.suites)) {
                      suite.suites.forEach(walk);
                    }
                    if (Array.isArray(suite.specs)) {
                      suite.specs.forEach(spec => {
                        spec.tests.forEach(test => {
                          total += 1;
                          const results = test.results || [];
                          const lastResult = results[results.length - 1];
                          if (!lastResult) return;
                          
                          const status = lastResult.status || '';
                          if (status === 'passed') passed += 1;
                          else if (status === 'failed') failed += 1;
                          else if (status === 'skipped') skipped += 1;
                          else if (status === 'timedOut') failed += 1;
                          
                          // Check if flaky (passed on retry)
                          if (results.length > 1 && status === 'passed') {
                            const firstFailed = results[0].status === 'failed';
                            if (firstFailed) flaky += 1;
                          }
                        });
                      });
                    }
                  };
                  data.suites.forEach(walk);
                  parsed = true;
                  console.log('Successfully parsed. Total:', total, 'Passed:', passed, 'Failed:', failed);
                }
              } else {
                console.log('No results content found');
              }
            } catch (e) {
              console.log('Error parsing Playwright JSON:', e.message || e);
              console.log('Stack:', e.stack);
            }

            if (parsed) {
              // Determine overall status
              const status = failed > 0 ? '❌ FAIL' : '✅ PASS';
              summaryLines.push(`### ${status}`);
              summaryLines.push('');
              summaryLines.push('| Metric | Count |');
              summaryLines.push('|--------|-------|');
              summaryLines.push(`| Total | ${total} |`);
              summaryLines.push(`| Passed | ${passed} ✅ |`);
              if (failed > 0) summaryLines.push(`| Failed | ${failed} ❌ |`);
              if (skipped > 0) summaryLines.push(`| Skipped | ${skipped} |`);
              if (flaky > 0) summaryLines.push(`| Flaky | ${flaky} ⚠️ |`);
            } else {
              summaryLines.push('### ⚠️ Unknown');
              summaryLines.push('');
              summaryLines.push('Could not parse test results. Check workflow logs for details.');
            }

            const body = summaryLines.join('\n');
            console.log('Comment body:', body);

            // Post or update comment on the PR
            const prNumber = context.payload.pull_request && context.payload.pull_request.number;
            console.log('PR number:', prNumber);
            console.log('Context payload:', JSON.stringify(context.payload, null, 2).substring(0, 500));

            if (!prNumber) {
              console.log('No pull request number found in context; skipping comment.');
              console.log('Full context:', JSON.stringify(context, null, 2).substring(0, 1000));
            } else {
              console.log('Attempting to post/update comment for PR #' + prNumber);
              
              // Try to find existing comment to update
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });
              
              console.log('Found', comments.length, 'existing comments');

              const botComment = comments.find(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('🧪 Playwright Smoke Tests')
              );

              if (botComment) {
                console.log('Updating existing comment:', botComment.id);
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
                console.log('Comment updated successfully');
              } else {
                console.log('Creating new comment');
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
                console.log('Comment created successfully');
              }
            }

name: Playwright Smoke Tests (Chromium)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  playwright-smoke:
    name: Run Playwright smoke (Chromium)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for leading '/pages/' hrefs (warn only)
        run: |
          set -euo pipefail
          echo "Searching repo for offending hrefs like href=\"/pages/...\" in HTML files (warn only)"
          # Limit search to HTML files and pages/ content to avoid matching CSS or workflow files
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            matches=$(git grep -n --line-number 'href="/pages/' -- '*.html' 'pages/**' || true)
          else
            matches=$(grep -RIn --exclude-dir=.git --include='*.html' 'href="/pages/' || true)
          fi
          if [ -n "$matches" ]; then
            echo "WARNING: Found leading '/pages/' hrefs (these will break on GitHub Pages):"
            echo "$matches"
            echo "Please replace leading '/pages/' with relative 'pages/'."
            # Do not fail the job; just warn so tests continue
          else
            echo "No offending '/pages/' hrefs found in HTML files."
          fi

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers (Chromium only)
        run: |
          # install only Chromium to speed up the workflow
          npx playwright install chromium

      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/mmdc-wst-http.log 2>&1 &
          echo $! > /tmp/mmdc-wst-server.pid
          sleep 1

      - name: Run smoke tests (chromium)
        id: run-tests
        run: |
          set -e
          # Capture Playwright output to a log so we can extract a concise summary
          echo "Running smoke tests and teeing output to /tmp/playwright-run.log"
          # Emit a machine-readable JSON reporter alongside the regular logs
          ./run-tests.sh smoke chromium --no-server --reporter=json 2>&1 | tee /tmp/playwright-run.log || true
        continue-on-error: true

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests/playwright/tests/playwright/results/**
            # include any Playwright JSON report files so CI can parse exact counts
            tests/playwright/tests/playwright/results/**/*.json
            test-results/**
            tests/playwright/**/trace.zip
            tests/playwright/**/screenshots/**
            /tmp/playwright-run.log
            /tmp/mmdc-wst-http.log

      - name: Post PR comment with summary
        if: always()
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            function safeRead(p) {
              try { return fs.readFileSync(p, 'utf8'); } catch (e) { return null; }
            }

            const summaryLines = [];
            summaryLines.push('## 🧪 Playwright Smoke Tests (Chromium)');
            summaryLines.push('');

            // Prefer parsing Playwright JSON report files if present for exact counts
            const resultsDir = path.join(process.cwd(), 'tests', 'playwright', 'tests', 'playwright', 'results');
            let parsed = false;
            let total = 0, passed = 0, failed = 0, skipped = 0, flaky = 0;

            try {
              if (fs.existsSync(resultsDir)) {
                const files = fs.readdirSync(resultsDir);
                // Find any JSON files produced by Playwright
                const jsonFiles = files.filter(f => f.endsWith('.json'));
                for (const jf of jsonFiles) {
                  try {
                    const data = JSON.parse(fs.readFileSync(path.join(resultsDir, jf), 'utf8'));
                    // Playwright JSON reporter emits 'suites' and 'entries' with results
                    if (data && Array.isArray(data.suites)) {
                      // Walk suites to gather counts
                      const walk = (node) => {
                        if (!node) return;
                        if (Array.isArray(node.suites)) node.suites.forEach(walk);
                        if (Array.isArray(node.tests)) {
                          node.tests.forEach(t => {
                            total += 1;
                            const status = (t.outcome || t.result || t.status || '').toLowerCase();
                            if (status === 'passed' || status === 'ok' ) passed += 1;
                            else if (status === 'failed' || status === 'error') failed += 1;
                            else if (status === 'skipped' || status === 'skipped') skipped += 1;
                            else if (status === 'flaky') flaky += 1;
                          });
                        }
                      };
                      data.suites.forEach(walk);
                      parsed = true;
                      break;
                    }
                    // Some reporters emit a top-level array of tests
                    if (Array.isArray(data)) {
                      data.forEach(t => {
                        total += 1;
                        const status = (t.outcome || t.status || '').toLowerCase();
                        if (status === 'passed') passed += 1;
                        else if (status === 'failed') failed += 1;
                        else if (status === 'skipped') skipped += 1;
                        else if (status === 'flaky') flaky += 1;
                      });
                      parsed = true;
                      break;
                    }
                  } catch (e) {
                    // ignore JSON parse errors for individual files
                  }
                }
              }
            } catch (e) {
              console.log('Error while reading Playwright JSON reports:', e.message || e);
            }

            if (parsed) {
              // Determine overall status
              const status = failed > 0 ? '❌ FAIL' : '✅ PASS';
              summaryLines.push(`### ${status}`);
              summaryLines.push('');
              summaryLines.push('| Metric | Count |');
              summaryLines.push('|--------|-------|');
              summaryLines.push(`| Total | ${total} |`);
              summaryLines.push(`| Passed | ${passed} ✅ |`);
              if (failed > 0) summaryLines.push(`| Failed | ${failed} ❌ |`);
              if (skipped > 0) summaryLines.push(`| Skipped | ${skipped} |`);
              if (flaky > 0) summaryLines.push(`| Flaky | ${flaky} ⚠️ |`);
            } else {
              summaryLines.push('### ⚠️ Unknown');
              summaryLines.push('');
              summaryLines.push('Could not parse test results. Check workflow logs for details.');
            }

            const body = summaryLines.join('\n');

            // Post or update comment on the PR
            const prNumber = context.payload.pull_request && context.payload.pull_request.number;
            if (!prNumber) {
              console.log('No pull request number found in context; skipping comment.');
            } else {
              // Try to find existing comment to update
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
              });

              const botComment = comments.find(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('🧪 Playwright Smoke Tests')
              );

              if (botComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body,
                });
              }
            }

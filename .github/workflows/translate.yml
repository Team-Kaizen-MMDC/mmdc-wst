name: Generate Locales

on:
    push:
        branches: [main]
    workflow_dispatch: {}

jobs:
    translate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install argostranslate

            - name: Ensure models (manual step if needed)
              run: |
                  # Download en->ja if the helper is available
                  if python -c "import argostranslate; print('ok')" 2>/dev/null; then
                    python -m argostranslate.download --from-lang en --to-lang ja || true
                  fi

            - name: Run translation script
              run: |
                  python scripts/translate_argos.py i18n/en.json locales/ja.json || true

            - name: Commit generated locales
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add locales/ja.json || true
                  git commit -m "chore(i18n): update ja.json" || echo "no changes to commit"
                  git push || echo "push failed"

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registration demo — Japan SSW</title>
    <style>
      body {
        font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        margin: 1rem;
        background: #111;
        color: #eee;
      }
      .player {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.25rem;
      }
      .meta {
        margin-bottom: 0.5rem;
        color: #aaa;
      }
      video {
        width: 100%;
        height: auto;
        border: 1px solid #222;
        background: #000;
      }
      .actions {
        margin-top: 0.5rem;
      }
      a.button {
        display: inline-block;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="player">
      <h1>Registration demo — excerpt</h1>
      <div class="meta">
        Short registration highlight. <a href="../README.md">Back to README</a>
      </div>
      <video controls poster="registration-excerpt-thumb.png">
        <source src="registration-excerpt.mp4" type="video/mp4" />
        Your browser does not support the video tag.
        <a href="registration-excerpt.mp4">Download MP4</a>
      </video>
      <div class="actions">
        <a class="button" href="registration-excerpt.mp4">Download MP4</a>
      </div>
    </div>

</html>
